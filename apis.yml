name: Model Medicines
description: >-
  Model Medicines is an AI-first biotechnology company based in San Diego,
  California, discovering and developing first-in-class small-molecule drugs by
  targeting fundamental disease mechanisms it calls biological choke points. Its
  end-to-end GALILEO AI engine spans drug design, target discovery, and
  preclinical development, supported by specialized models including AmesNet for
  regulatory-grade toxicology prediction and ChemPrint for chemical property
  prediction. Lead programs target RdRp Thumb-1 (a conserved allosteric pocket on
  viral RNA-dependent RNA polymerase) and BRD4, with lead assets MDL-001, a
  broad-spectrum oral antiviral candidate, and MDL-4102. Surfaced as a portfolio
  company of 8vc and added to the API Evangelist network. As of this enrichment
  pass Model Medicines publishes no public API, developer portal, SDK, or
  documentation surface; its AI platform is used internally for drug discovery.
